
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — The Steak Sheikh</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 24px;
  }
  .wrap { max-width: 360px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
  button {
    background: #c9a96e; color: #0a0a0a; border: none; border-radius: 6px;
    padding: 12px 28px; font-size: 13px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .icon { font-size: 40px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🥩</div>
    <h1>You're offline</h1>
    <p>Looks like you've lost your connection. Check it and try again — your cart will still be here.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
